<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lki</title>
</head>

<body>
  <div id="app" x-data="dataContent">
    <!-- header dekstop -->
    <header id="masthead" class="flex flex-col justify-center  items-center dekstop-navbar  border-gray-300/40"
      :class="{'scrolled': scrolled}" x-data="{ scrolled: false }" @scroll.window="scrolled = window.scrollY > 50">
      <div class="container">
        <div class="flex gap-4 items-center justify-between">
          <!-- logo -->
          <div class="shrink-0 bg-white p-3 ">
            <a href="#">
              <img src="logo.svg" class="w-16 h-auto">
            </a>
          </div>
          <ul class="flex justify-between gap-6">
            <template x-for="(item, index) in data.menu_utama" :key="index">
              <li class="relative" x-data="{ open: false }" @mouseenter="open = true" @mouseleave="open = false">

                <a :href="item.url"
                  class="hover:text-primary font-medium uppercase inline-flex items-center gap-1 py-2">
                  <span x-text="item.label"></span>
                  <template x-if="item.sub_menu && item.sub_menu.length > 0">
                    <svg class="w-4 h-4 transition-transform duration-200" :class="{ 'rotate-180': open }" fill="none"
                      stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                  </template>
                </a>

                <!-- Mega Menu Full Width -->
                <template x-if="item.sub_menu && item.sub_menu.length > 0">
                  <div x-show="open" x-transition:enter="transition ease-out duration-200"
                    x-transition:enter-start="opacity-0 -translate-y-2"
                    x-transition:enter-end="opacity-100 translate-y-0"
                    x-transition:leave="transition ease-in duration-150"
                    x-transition:leave-start="opacity-100 translate-y-0"
                    x-transition:leave-end="opacity-0 -translate-y-2"
                    class="fixed left-1/2  top-auto -translate-x-1/2  mt-0 bg-white shadow-xl  z-50 w-screen max-w-7xl"
                    @click.away="open = false">

                    <div class="container py-6">

                      <div class="grid grid-cols-3 gap-10">
                        <template x-for="(sub, subIndex) in item.sub_menu" :key="subIndex">
                          <a :href="sub.url" class="block hover:text-primary transition-all duration-200   group">
                           <img :src="sub.image" alt="" class="w-full h-28 rounded-lg mb-5 object-cover object-center group-hover:scale-105 duration-300">
                            <h3 class="text-xl mb-1" x-text="sub.label"></h3>
                            <p class="text-xs opacity-70" x-text="sub.description || ''"></p>
                          </a>
                        </template>
                      </div>
                    </div>
                  </div>
                </template>
              </li>
            </template>
          </ul>
          <button class="text-xl"><i class="bi bi-search"></i></button>
        </div>
      </div>
    </header><!--  end dekstop navbar -->

    <!-- mobile navbar -->
    <header id="masthead" class="mobile-navbar" x-data="{openMenu: false}">
      <nav class="px-6 flex justify-between items-center border-b py-2 border-gray-300/40">
        <a href="#">
          <img src="logo.svg" class="w-16 h-auto">
        </a>
        <button href="#" @click="openMenu = !openMenu" class="text-primary">
          <i class="bi bi-list text-4xl"></i>
        </button>
      </nav>
      <div x-show="openMenu">
        <div class=" top-full left-0 w-full h-full bg-white p-6 z-50">
          <ul x-show="data.menu_utama" class="flex flex-col gap-3">
            <template x-for="(item, index) in data.menu_utama" :key="index">
              <li x-data="{ open: false }">
                <!-- Main Menu -->
                <a :href="item.sub_menu && item.sub_menu.length > 0 ? '#' : item.url"
                  @click="if(item.sub_menu && item.sub_menu.length > 0) { open = !open; $event.preventDefault(); }"
                  class="text-xs uppercase flex items-center justify-between py-2">
                  <span x-text="item.label"></span>
                  <template x-if="item.sub_menu && item.sub_menu.length > 0">
                    <i class="bi bi-chevron-down transition-transform duration-200" :class="{ 'rotate-180': open }"></i>
                  </template>
                </a>

                <!-- Submenu -->
                <template x-if="item.sub_menu && item.sub_menu.length > 0">
                  <ul x-show="open" x-transition:enter="transition ease-out duration-200"
                    x-transition:enter-start="opacity-0 -translate-y-2"
                    x-transition:enter-end="opacity-100 translate-y-0"
                    x-transition:leave="transition ease-in duration-150"
                    x-transition:leave-start="opacity-100 translate-y-0"
                    x-transition:leave-end="opacity-0 -translate-y-2"
                    class="pl-4 mt-2 space-y-2 border-l-2 border-gray-200">
                    <template x-for="(sub, subIndex) in item.sub_menu" :key="subIndex">
                      <li>
                        <a :href="sub.url" x-text="sub.label"
                          class="text-xs text-gray-600 hover:text-primary transition-colors block py-1"></a>
                      </li>
                    </template>
                  </ul>
                </template>
              </li>
            </template>
          </ul>
        </div>
      </div>
    </header> <!-- end mobile navbar -->

    <!--   home slideshow -->
    <section id="homeSlider" class="splide mb-16" aria-labelledby="carousel-heading">
      <div class="splide__track">
        <div class="splide__list">
          <template x-for="item in data.slideshow" :key="item">
            <div class="splide__slide relative w-full h-screen  ">
              <div class="absolute top-0 left-0 w-full h-full bg-black opacity-20 z-10"></div>
              <img :src="item.image" class="w-full h-screen object-cover object-center">
              <div
                class="absolute z-20 bottom-20 left-1/2 transform -translate-x-1/2  max-w-[1140px] w-full px-6 py-20 lg:py-0">
                <div class="max-w-[768px]">
                  <h1 class="text-4xl font-bold text-white r mb-4" x-text="item.title"></h1>
                  <p class="text-lg text-white mb-6 " x-text="item.sub_title"></p>
                  <a href="#" class="text-white border-2 border-white py-3 px-5 hover:bg-primary hover:text-white  duration-300"> Read More</a>
                </div>

              </div>
            </div>
          </template>
        </div>
      </div>

      <div class="splide__progress">
        <div class="splide__progress__bar ">
        </div>
      </div>


    </section>
    <!-- produk unggulan -->
    <section class="mb-16">
      <div class="container ">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:divide-x divide-gray-300">
          <div class="lg:col-span-3 flex items-center p-6">
            <h2 class="font-bold text-2xl lg:text-4xl text-primary" x-text="data.rekomendasi[0].title"></h2>
          </div>
          <div class="lg:col-span-9">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-10">
              <template x-for="pr in data.rekomendasi[1].product" :key="pr.title">
                <div
                  class="border border-gray-300 flex flex-col hover:shadow-lg transition-shadow duration-300 group rounded-lg overflow-hidden">
                  <div class="h-[140px] relative overflow-hidden">
                    <img :src="pr.image" class="w-full h-[140px] object-cover group-hover:scale-105 duration-300">
                  </div>

                  <div class="p-4 flex flex-col flex-1">
                    <div class="flex-1">
                      <p class="text-sm font-semibold mb-2" x-text="pr.title"></p>
                      <p class="text-sm text-gray-600" x-text="pr.description"></p>
                    </div>
                    <a href="#" class="mt-4 inline-block group text-primary">
                      Lebih Lanjut
                      <i
                        class="bi bi-arrow-right inline-block transition-transform duration-300 group-hover:translate-x-2"></i>
                    </a>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Sekilas Lida Karya -->
    <section class="mb-16">
      <div class="container">
        <div class="max-w-screen-md mx-auto text-center">
          <h2 class="text-2xl lg:text-4xl mb-5 font-medium" x-text="data.sekilas[0].title"></h2>
          <div class="max-w-[150px] h-1.25 bg-primary mx-auto mb-5"></div>
          <p class="text-lg" x-text="data.sekilas[0].deskripsi"></p>
        </div>
      </div>
    </section>

    <!--  Keunggulan -->
    <section class="mb-16">
      <div class="container">
        <div class="grid grid-cols-1 lg:grid-cols-6 gap-6">
          <div class="lg:col-span-2">
            <div class="p-4 lg:p-6 bg-white relative z-10 lg:-mr-20 ">
              <h2 x-text="data.aplikasi_produk[0].title" class="text-3xl font-medium mb-5"></h2>
              <p x-text="data.aplikasi_produk[0].deskripsi"></p>
              <a href="#"
                class="inline-block mt-4 border-primary border-2 text-primary py-2 px-6 group hover:bg-primary hover:text-white duration-300">
                Read More
                <i
                  class="bi bi-arrow-right inline-block transition-transform duration-300 group-hover:translate-x-2"></i>
              </a>
            </div>
          </div>
          <div class="lg:col-span-4">
            <div class="grid grid-cols-1 md:grid-cols-2">
              <template x-for="item in data.aplikasi_produk[0].images">
                <div class="w-full h-[180px] overflow-hidden relative bg-black  ">
                  <img :src="item" class="w-full h-[180px] object-cover hover:scale-105 hover:opacity-65 duration-200">
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="mb-16 ">
      <div class="container">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 lg:gap-10">
          <div class="group cursor-pointer">
            <div class="w-full h-52 overflow-hidden">
              <img :src="data.katalog.image" alt=""
                class="w-full h-52 object-cover object-center group-hover:scale-105 duration-300">
            </div>
            <div class="flex flex-wrap gap-2 justify-between items-center pr-2">
              <h4 class="text-xl font-medium" x-text="data.katalog.title"></h4>
              <i class="bi bi-arrow-right text-2xl group-hover:translate-x-2 duration-300"></i>
            </div>

          </div>
          <div class="group cursor-pointer">
            <div class="w-full h-52 overflow-hidden">
              <img :src="data.dukungan.image" alt=""
                class="w-full h-52 object-cover object-center group-hover:scale-105 duration-300">
            </div>
            <div class="flex flex-wrap gap-2 justify-between items-center pr-2">
              <h4 class="text-xl font-medium" x-text="data.dukungan.title"></h4>
              <i class="bi bi-arrow-right text-2xl group-hover:translate-x-2 duration-300"></i>
            </div>

          </div>
        </div>
      </div>
    </section>

    <footer class="pt-16 border-t border-gray-300 bg-gray-100 text-sm">
      <div class="container">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 lg:gap-10">
          <div class="flex flex-col justify-center gap-2 lg:col-span-2 ">
            <img :src="data.footer.logo" alt="" class="w-12">
            <p class="text-xs" x-text="data.footer.deskripsi"></p>
          </div>
          <div class="flex flex-col gap-2">
            <h4 class="text-lg font-medium">Kontak</h4>
            <p class="flex gap-2"><i class="bi bi-geo-alt"></i> <span x-text="data.footer.contact.alamat"></span> </p>
            <p class=" flex gap-2"><i class="bi bi-telephone"></i>
              <span x-text="data.footer.contact.phone"></span>
            </p>
            <p class="flex gap-2"> <i class="bi bi-envelope"></i>
              <span x-text="data.footer.contact.email"></span>
            </p>
          </div>
          <div class="flex flex-col gap-2">
            <h4 class="text-lg font-medium">Produk</h4>
            <ul>
              <template x-for="item in data.menu_utama[1].sub_menu">
                <li><a :href="item.url" x-text="item.label" class="hover:text-primary duration-200"></a></li>
              </template>
            </ul>
          </div>
        </div>
      </div>
      <div class="py-2 text-center border-t border-gray-300 mt-10">
        <div class="container">
          <p class="text-xs" x-text="data.footer.copyright"></p>
        </div>
      </div>
    </footer>
  </div>
  <script type="module" src="/src/main.js"></script>
  <script>

  </script>
</body>

</html>
